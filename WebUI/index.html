<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CopyTool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="css/styles.css" rel="stylesheet">
    <link href="css/materials.css" rel="stylesheet">
</head>
<body>
    <canvas id="gl"></canvas>

    <div class="m2-panel main-panel">
        <div class="app-layout">

            <aside class="sidebar">
                <div class="nav-item active" data-page="home">
                    <svg viewBox="0 0 24 24" class="nav-icon">
                        <path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"
                              fill="none" stroke="currentColor" stroke-width="1.8"
                              stroke-linejoin="round"/>
                    </svg>
                    <span data-i18n="nav.home">主页</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24" class="nav-icon">
                        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"
                              fill="none" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                              fill="none" stroke="currentColor" stroke-width="1.6"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span data-i18n="nav.settings">设置</span>
                </div>
            </aside>

            <main class="content page-home">
                <header class="page-header">
                    <h1>CopyTool</h1>
                    <p data-i18n="app.subtitle">快速、简洁的文件复制</p>
                </header>

                <div class="form-row">
                    <label data-i18n="form.srcLabel">源文件夹</label>
                    <div class="input-group">
                        <input type="text" id="srcPath"
                               data-i18n-placeholder="form.srcPlaceholder"
                               placeholder="选择源文件夹..." spellcheck="false">
                        <button class="m4-btn" id="btnBrowseSrc" data-i18n="btn.browse">浏览</button>
                    </div>
                </div>

                <div class="form-row">
                    <label data-i18n="form.dstLabel">目标文件夹</label>
                    <div class="input-group">
                        <input type="text" id="dstPath"
                               data-i18n-placeholder="form.dstPlaceholder"
                               placeholder="选择目标文件夹..." spellcheck="false">
                        <button class="m4-btn" id="btnBrowseDst" data-i18n="btn.browse">浏览</button>
                    </div>
                </div>

                <div class="status-row">
                    <span class="status-text" id="statusText" data-i18n="status.ready">准备就绪</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <span class="status-percent" id="statusPercent">0%</span>
                </div>

                <div class="controls-row">
                    <div class="select-group">
                        <label data-i18n="form.strategyLabel">策略</label>
                        <select class="m4-select" id="strategySelect">
                            <option value="0" data-i18n="strategy.auto">智能检测</option>
                            <option value="1" data-i18n="strategy.small">小文件优化</option>
                            <option value="2" data-i18n="strategy.large">大文件优化</option>
                            <option value="3" data-i18n="strategy.balanced">平衡模式</option>
                        </select>
                    </div>
                    <label class="checkbox-group">
                        <input type="checkbox" id="verifyCheck">
                        <span class="checkbox-box"></span>
                        <span class="checkbox-label" data-i18n="form.verify">校验完整性</span>
                    </label>
                </div>

                <div class="actions-row">
                    <button class="box start-btn" id="btnStart"
                            style="--w: 160px; --h: 38px; --r: 19px; --tr: 25%;">
                        <span data-i18n="btn.start">开始复制</span>
                    </button>
                    <button class="m4-btn m4-btn--outline" id="btnPause" disabled data-i18n="btn.pause">暂停</button>
                    <button class="m4-btn m4-btn--outline" id="btnStop" disabled data-i18n="btn.stop">终止</button>
                </div>
            </main>

            <main class="content page-settings" style="display: none;">
                <header class="page-header">
                    <h1 data-i18n="settings.title">设置</h1>
                </header>

                <div class="form-row">
                    <label data-i18n="form.speedLimit">速度限制</label>
                    <div class="input-group">
                        <input type="text" id="speedInput" value="0" spellcheck="false">
                        <select class="m4-select m4-select--compact" id="unitSelect">
                            <option value="0">KB/s</option>
                            <option value="1" selected>MB/s</option>
                            <option value="2">GB/s</option>
                        </select>
                    </div>
                    <span class="hint" data-i18n="hint.unlimited">0 = 不限速</span>
                </div>

                <div class="form-row">
                    <label data-i18n="form.language">语言</label>
                    <select class="m4-select" id="langSelect">
                        <option value="0" data-i18n="lang.zhCN">简体中文</option>
                        <option value="1" data-i18n="lang.zhTW">繁體中文</option>
                        <option value="2" data-i18n="lang.en">English</option>
                        <option value="3" data-i18n="lang.ko">한국어</option>
                        <option value="4" data-i18n="lang.ja">日本語</option>
                    </select>
                </div>

                <div class="actions-row">
                    <button class="box" id="btnSave"
                            style="--w: 120px; --h: 38px; --r: 19px; --tr: 25%;">
                        <span data-i18n="btn.save">保存</span>
                    </button>
                    <button class="m4-btn m4-btn--outline" id="btnCancel" data-i18n="btn.cancel">取消</button>
                </div>
            </main>

        </div>
    </div>

    <div class="dialog-overlay" id="dialogOverlay" style="display: none;">
        <div class="dialog-box">
            <div class="dialog-icon" id="dialogIcon">i</div>
            <div class="dialog-body">
                <h3 id="dialogTitle">CopyTool</h3>
                <p id="dialogMessage"></p>
            </div>
            <div class="dialog-actions">
                <button class="m4-btn m4-btn--primary" id="dialogOk" data-i18n="btn.ok">确定</button>
            </div>
        </div>
    </div>

    <script type="module" src="./renderer.js"></script>
    <script src="./copytool-bridge.js"></script>
    <script src="./ui.js"></script>
</body>
</html>
